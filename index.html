<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050816">
  <title>Abyss Defense v0.8</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="startScreen" class="start-screen">
      <div class="start-card">
        <p class="eyebrow">ABYSS DEFENSE</p>
        <h1>맵을 선택하세요</h1>
        <p class="start-copy">v0.8 모바일 전체화면 UI</p>

        <div id="mapCards" class="map-select-grid"></div>

        <p class="start-note">
          맵을 선택하면 새 게임이 시작됩니다.
        </p>
      </div>
    </section>

    <header class="hud">
      <div class="hud-brand">
        <strong>Abyss Defense</strong>
        <span id="mapNameText">심연 입구</span>
      </div>

      <div class="hud-stats">
        <div>
          <span>G</span>
          <strong id="goldText">0</strong>
        </div>
        <div>
          <span>HP</span>
          <strong id="baseHpText">0</strong>
        </div>
        <div>
          <span>WAVE</span>
          <strong id="waveText">1/20</strong>
        </div>
      </div>

      <div id="statusText" class="status-chip">대기</div>
    </header>

    <section id="gameStage" class="game-stage">
      <canvas
        id="gameCanvas"
        width="360"
        height="450"
        aria-label="Abyss Defense game board"
      ></canvas>

      <div id="towerActionMenu" class="tower-action-menu"></div>

      <button
        id="waveOverlayButton"
        class="wave-overlay-button"
        type="button"
      >
        <span id="waveOverlayTitle">Wave 1</span>
        <strong id="waveOverlayName">말랑한 침입</strong>
        <small id="waveOverlayHint">눌러서 시작</small>
      </button>

      <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <section class="tower-dock" aria-label="타워 선택">
      <button
        id="cancelBuildBtn"
        class="tower-quick cancel"
        type="button"
        aria-label="선택 취소"
      >
        ×
      </button>

      <div id="towerQuickBar" class="tower-quick-bar"></div>
    </section>

    <nav class="control-dock" aria-label="게임 조작">
      <button
        id="startWaveBtn"
        class="control-primary"
        type="button"
      >
        시작
      </button>

      <button
        id="heroSkillBtn"
        class="control-skill"
        type="button"
      >
        성광
      </button>

      <button id="speedBtn" type="button">1x</button>
      <button id="pauseBtn" type="button">정지</button>
      <button id="infoBtn" type="button">정보</button>
    </nav>

    <div id="sheetBackdrop" class="sheet-backdrop"></div>

    <section
      id="bottomSheet"
      class="bottom-sheet"
      aria-label="게임 정보"
    >
      <div class="sheet-handle"></div>

      <div class="sheet-tabs">
        <button
          class="sheet-tab is-active"
          data-tab="wave"
          type="button"
        >
          웨이브
        </button>

        <button
          class="sheet-tab"
          data-tab="hero"
          type="button"
        >
          히어로
        </button>

        <button
          class="sheet-tab"
          data-tab="relic"
          type="button"
        >
          유물
        </button>

        <button
          class="sheet-tab"
          data-tab="settings"
          type="button"
        >
          설정
        </button>
      </div>

      <div id="sheetContent" class="sheet-content"></div>
    </section>

    <div
      id="traitModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-card">
        <p class="eyebrow">TOWER TRAIT</p>
        <h2 id="traitModalTitle">타워 특성 선택</h2>
        <p id="traitModalDesc"></p>
        <div id="traitOptions" class="choice-list"></div>
      </div>
    </div>

    <div
      id="relicModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-card">
        <p class="eyebrow">BOSS REWARD</p>
        <h2>유물 선택</h2>
        <p>이번 전투에 적용할 유물 하나를 선택하세요.</p>
        <div id="relicOptions" class="choice-list"></div>
      </div>
    </div>
  </main>

  <div
    id="startupError"
    hidden
    style="
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      padding: 12px;
      border: 1px solid #ef4444;
      border-radius: 12px;
      background: rgba(69, 10, 10, 0.96);
      color: #fee2e2;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      white-space: pre-wrap;
    "
  ></div>

  <script>
    window.addEventListener("error", function (event) {
      const errorBox = document.getElementById("startupError");

      if (!errorBox) {
        return;
      }

      errorBox.hidden = false;
      errorBox.textContent =
        "게임 실행 오류\n" +
        (event.message || "JavaScript 파일을 불러오지 못했습니다.") +
        (event.filename
          ? "\n파일: " + event.filename
          : "") +
        (event.lineno
          ? "\n줄: " + event.lineno
          : "");
    });
  </script>

  <!--
    defer를 제거하고 body 마지막에서 순서대로 실행합니다.
    쿼리 문자열은 GitHub Pages와 브라우저 캐시를 갱신하기 위한 것입니다.
  -->
  <script src="./data.js?v=0.8.1"></script>
  <script src="./main.js?v=0.8.1"></script>

  <script>
    window.setTimeout(function () {
      const errorBox =
        document.getElementById("startupError");

      const mapCards =
        document.getElementById("mapCards");

      if (!errorBox) {
        return;
      }

      if (!window.ABYSS_DATA) {
        errorBox.hidden = false;
        errorBox.textContent =
          "data.js가 실행되지 않았습니다.\n" +
          "index.html과 data.js가 같은 폴더에 있는지 확인하세요.\n" +
          "파일명은 소문자 data.js여야 합니다.";

        return;
      }

      if (
        !mapCards ||
        mapCards.children.length === 0
      ) {
        errorBox.hidden = false;
        errorBox.textContent =
          "data.js는 정상적으로 실행됐지만 맵 카드가 생성되지 않았습니다.\n" +
          "main.js가 실행되지 않았거나 실행 중 오류가 발생했습니다.\n" +
          "파일명과 GitHub Commit 상태를 확인하세요.";
      }
    }, 800);
  </script>
</body>
</html>
</body>
</html>
