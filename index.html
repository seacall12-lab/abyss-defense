<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abyss Defense v0.4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top-header">
      <div>
        <h1>Abyss Defense</h1>
        <p>v0.4 Growth Defense</p>
      </div>
      <div id="statusText" class="status-pill">대기 중</div>
    </header>

    <section class="resource-bar" aria-label="게임 상태">
      <div class="resource-card"><span>Gold</span><strong id="goldText">0</strong></div>
      <div class="resource-card"><span>Base HP</span><strong id="baseHpText">0</strong></div>
      <div class="resource-card"><span>Wave</span><strong id="waveText">1/20</strong></div>
    </section>

    <section class="canvas-card">
      <canvas id="gameCanvas" width="360" height="450" aria-label="Abyss Defense game board"></canvas>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>

    <section class="control-row" aria-label="게임 조작">
      <button id="startWaveBtn" class="primary-btn" type="button">웨이브 시작</button>
      <button id="speedBtn" type="button">1x</button>
      <button id="pauseBtn" type="button">일시정지</button>
      <button id="resetBtn" class="danger-btn" type="button">초기화</button>
    </section>

    <section class="tower-section">
      <div class="section-title">타워 배치</div>
      <div id="towerCards" class="tower-cards"></div>
    </section>

    <section class="panel-wrap">
      <article id="towerPanel" class="info-panel"></article>
      <article id="heroPanel" class="info-panel"></article>
    </section>

    <footer class="guide-text">
      빈 타일을 누르면 선택한 타워를 설치합니다. 설치된 타워를 누르면 강화하거나 판매할 수 있습니다.
    </footer>
  </main>

  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
