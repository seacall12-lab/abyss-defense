<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >
  <meta name="theme-color" content="#050816">
  <title>Abyss Defense v0.9.0</title>

  <link rel="stylesheet" href="./style.css?v=0.9.0">
  <link rel="stylesheet" href="./progression.css?v=0.9.0">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="startScreen" class="start-screen">
      <div class="start-card">
        <p class="eyebrow">ABYSS DEFENSE</p>
        <h1>맵을 선택하세요</h1>
        <p class="start-copy">v0.9.0 심연 원정 업데이트</p>

        <div class="progression-summary">
          <div class="progression-currency">
            <span class="progression-currency-icon">◆</span>

            <div class="progression-currency-copy">
              <span>보유 심연석</span>
              <strong id="abyssStoneText">0</strong>
            </div>
          </div>

          <button
            id="openUpgradeBtn"
            class="progression-open-btn"
            type="button"
          >
            영구 강화
          </button>
        </div>

        <div
          id="mapCards"
          class="map-select-grid"
        ></div>

        <p class="start-note">
          스테이지를 클리어하고 심연석으로 영구 강화를 해금하세요.
        </p>
      </div>
    </section>

    <header class="hud">
      <div class="hud-brand">
        <strong>Abyss Defense</strong>
        <span id="mapNameText">심연 입구</span>
      </div>

      <div class="hud-stats">
        <div>
          <span>G</span>
          <strong id="goldText">0</strong>
        </div>

        <div>
          <span>HP</span>
          <strong id="baseHpText">0</strong>
        </div>

        <div>
          <span>WAVE</span>
          <strong id="waveText">1/20</strong>
        </div>
      </div>

      <div
        id="statusText"
        class="status-chip"
      >
        대기
      </div>
    </header>

    <section
      id="gameStage"
      class="game-stage"
    >
      <canvas
        id="gameCanvas"
        width="360"
        height="450"
        aria-label="Abyss Defense 게임 화면"
      ></canvas>

      <div
        id="towerActionMenu"
        class="tower-action-menu"
      ></div>

      <button
        id="waveOverlayButton"
        class="wave-overlay-button"
        type="button"
      >
        <span id="waveOverlayTitle">
          Wave 1
        </span>

        <strong id="waveOverlayName">
          말랑한 침입
        </strong>

        <small id="waveOverlayHint">
          눌러서 시작
        </small>
      </button>

      <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <section
      class="tower-dock"
      aria-label="타워 선택"
    >
      <button
        id="cancelBuildBtn"
        class="tower-quick cancel"
        type="button"
        aria-label="타워 선택 취소"
      >
        ×
      </button>

      <div
        id="towerQuickBar"
        class="tower-quick-bar"
      ></div>
    </section>

    <nav
      class="control-dock"
      aria-label="게임 조작"
    >
      <button
        id="startWaveBtn"
        class="control-primary"
        type="button"
      >
        시작
      </button>

      <button
        id="heroSkillBtn"
        class="control-skill"
        type="button"
      >
        성광
      </button>

      <button
        id="speedBtn"
        type="button"
      >
        1x
      </button>

      <button
        id="pauseBtn"
        type="button"
      >
        정지
      </button>

      <button
        id="infoBtn"
        type="button"
      >
        정보
      </button>
    </nav>

    <div
      id="sheetBackdrop"
      class="sheet-backdrop"
    ></div>

    <section
      id="bottomSheet"
      class="bottom-sheet"
      aria-label="게임 정보"
    >
      <div class="sheet-handle"></div>

      <div class="sheet-tabs">
        <button
          class="sheet-tab is-active"
          data-tab="wave"
          type="button"
        >
          웨이브
        </button>

        <button
          class="sheet-tab"
          data-tab="hero"
          type="button"
        >
          히어로
        </button>

        <button
          class="sheet-tab"
          data-tab="relic"
          type="button"
        >
          유물
        </button>

        <button
          class="sheet-tab"
          data-tab="settings"
          type="button"
        >
          설정
        </button>
      </div>

      <div
        id="sheetContent"
        class="sheet-content"
      ></div>
    </section>

    <div
      id="traitModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-card">
        <p class="eyebrow">
          TOWER TRAIT
        </p>

        <h2 id="traitModalTitle">
          타워 특성 선택
        </h2>

        <p id="traitModalDesc"></p>

        <div
          id="traitOptions"
          class="choice-list"
        ></div>
      </div>
    </div>

    <div
      id="relicModal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-card">
        <p class="eyebrow">
          BOSS REWARD
        </p>

        <h2>유물 선택</h2>

        <p>
          유물 하나를 선택하세요.
        </p>

        <div
          id="relicOptions"
          class="choice-list"
        ></div>
      </div>
    </div>

    <div
      id="upgradeModal"
      class="modal-backdrop progression-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="upgradeModalTitle"
    >
      <div class="modal-card progression-card">
        <div class="progression-modal-head">
          <div>
            <p class="eyebrow">
              PERMANENT UPGRADE
            </p>

            <h2 id="upgradeModalTitle">
              심연 연구소
            </h2>
          </div>

          <div class="progression-modal-currency">
            ◆
            <span id="upgradeCurrencyText">
              0
            </span>
          </div>
        </div>

        <p>
          구매한 강화는 모든 맵과 다음 원정에 영구 적용됩니다.
        </p>

        <div
          id="upgradeMessage"
          class="upgrade-message"
        ></div>

        <div
          id="upgradeList"
          class="upgrade-list"
        ></div>

        <button
          id="closeUpgradeBtn"
          class="progression-close-btn"
          type="button"
        >
          닫기
        </button>
      </div>
    </div>

    <div
      id="resultModal"
      class="modal-backdrop result-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resultTitle"
    >
      <div class="modal-card progression-card result-card">
        <p
          id="resultEyebrow"
          class="eyebrow"
        >
          STAGE CLEAR
        </p>

        <h2 id="resultTitle">
          방어 결과
        </h2>

        <div id="resultContent"></div>

        <div class="result-actions">
          <button
            id="resultMapBtn"
            type="button"
          >
            맵 선택
          </button>

          <button
            id="resultRetryBtn"
            class="primary"
            type="button"
          >
            다시 도전
          </button>
        </div>
      </div>
    </div>

    <div
      id="startupError"
      class="startup-error"
      hidden
    ></div>
  </main>

  <script>
    window.addEventListener("error", function (event) {
      var box = document.getElementById("startupError");

      if (!box) {
        return;
      }

      box.hidden = false;

      box.textContent =
        "게임 실행 오류\n" +
        (event.message || "알 수 없는 오류") +
        (event.filename
          ? "\n파일: " + event.filename
          : "") +
        (event.lineno
          ? "\n줄: " + event.lineno
          : "");
    });
  </script>

  <script src="./data.js?v=0.9.0"></script>
  <script src="./state.js?v=0.9.0"></script>
  <script src="./progression.js?v=0.9.0"></script>
  <script src="./combat.js?v=0.9.0"></script>
  <script src="./render.js?v=0.9.0"></script>
  <script src="./ui.js?v=0.9.0"></script>
  <script src="./main.js?v=0.9.0"></script>
</body>
</html>
